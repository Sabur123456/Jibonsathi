name: Build JibonSathi APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Find and extract source ZIP
    run: |
      ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "Source ZIP not found"
        exit 1
      fi
      mkdir source
      unzip -q "$ZIP_FILE" -d source
      find source -name settings.gradle.kts -print -quit

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    run: |
      PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/source" -name settings.gradle.kts -print -quit)")
      if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
        echo "Android project files not found"
        exit 1
      fi
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: JibonSathi-APK
      path: source/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
